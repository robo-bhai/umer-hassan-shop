{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block extrahead %}
{{ block.super }}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
{% endblock %}

{% block content %}

<!-- Purchase Summary Display Section -->
<div style="margin-bottom: 20px; padding: 15px; background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); border-radius: 10px; color: white;">
    <h4 style="margin-top: 0; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;">
        💰 PURCHASE SUMMARY
        <button type="button" id="refresh-total-btn" style="padding: 5px 15px; background: rgba(255,255,255,0.3); color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 12px;">
            🔄 Refresh
        </button>
    </h4>
    
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; text-align: center;">
        <div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px;">
            <div style="font-size: 12px; opacity: 0.9;">Subtotal</div>
            <div id="purchase-subtotal-display" style="font-size: 20px; font-weight: bold;">Rs. 0.00</div>
        </div>
        
        <div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px;">
            <div style="font-size: 12px; opacity: 0.9;">Paid Amount</div>
            <div id="purchase-paid-display" style="font-size: 20px; font-weight: bold;">Rs. 0.00</div>
        </div>
        
        <div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px;">
            <div style="font-size: 12px; opacity: 0.9;">Outstanding</div>
            <div id="purchase-outstanding-display" style="font-size: 24px; font-weight: bold;">Rs. 0.00</div>
        </div>
    </div>
    
    <!-- Payment Progress Bar -->
    <div style="margin-top: 15px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px;">
            <span>Payment Progress</span>
            <span id="payment-percentage">0%</span>
        </div>
        <div style="background: rgba(255,255,255,0.3); height: 8px; border-radius: 4px; margin-top: 5px;">
            <div id="payment-progress-bar" style="background: #28a745; height: 100%; width: 0%; border-radius: 4px; transition: width 0.3s;"></div>
        </div>
    </div>
    
    <!-- Item Count -->
    <div style="margin-top: 10px; text-align: center; font-size: 12px; opacity: 0.9;">
        <span id="item-count-display">0 items</span>
    </div>
</div>

{{ block.super }}

<script>
$(document).ready(function() {
    
    // ============================================
    // ADD TOTAL COLUMN TO TABLE
    // ============================================
    function addTotalColumnToTable() {
        var table = $('.inline-group table');
        if (table.length && table.find('thead tr .total-column-header').length === 0) {
            table.find('thead tr').append('<th class="total-column-header" style="text-align: right; padding: 8px;">Item Total</th>');
        }
        
        $('.dynamic-purchaseitem_set').each(function() {
            var row = $(this).closest('tr');
            if (row.find('.row-total-display').length === 0) {
                row.append('<td class="row-total-display" style="font-weight: bold; text-align: right; padding: 8px; color: #ff9800;">-</td>');
            }
        });
    }
    
    // ============================================
    // LIVE ROW TOTAL CALCULATION
    // ============================================
    function updateRowTotal(rowIndex) {
        var qtyField = $('#id_purchaseitem_set-' + rowIndex + '-qty');
        var priceField = $('#id_purchaseitem_set-' + rowIndex + '-price');
        var row = qtyField.closest('tr');
        
        if (qtyField.length && priceField.length) {
            var qty = parseFloat(qtyField.val()) || 0;
            var price = parseFloat(priceField.val()) || 0;
            var total = qty * price;
            
            var totalCell = row.find('.row-total-display');
            if (totalCell.length === 0) {
                totalCell = $('<td class="row-total-display" style="font-weight: bold; text-align: right; padding: 8px;"></td>');
                row.append(totalCell);
            }
            
            totalCell.text('Rs. ' + total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
            
            if (total > 50000) {
                totalCell.css('color', '#f44336');
            } else if (total > 25000) {
                totalCell.css('color', '#ff9800');
            } else {
                totalCell.css('color', '#4caf50');
            }
        }
    }
    
    function updateAllRowTotals() {
        var totalForms = $('#id_purchaseitem_set-TOTAL_FORMS');
        var formCount = parseInt(totalForms.val()) || 0;
        
        for (var i = 0; i < formCount; i++) {
            var productSelect = $('#id_purchaseitem_set-' + i + '-product');
            if (productSelect.length && productSelect.val()) {
                updateRowTotal(i);
            }
        }
    }
    
    // ============================================
    // LIVE PURCHASE TOTAL CALCULATION
    // ============================================
    function getAllPurchaseItems() {
        var items = [];
        var totalForms = $('#id_purchaseitem_set-TOTAL_FORMS');
        var formCount = parseInt(totalForms.val()) || 0;
        
        for (var i = 0; i < formCount; i++) {
            var productSelect = $('#id_purchaseitem_set-' + i + '-product');
            var qtyField = $('#id_purchaseitem_set-' + i + '-qty');
            var priceField = $('#id_purchaseitem_set-' + i + '-price');
            var deleteCheckbox = $('#id_purchaseitem_set-' + i + '-DELETE');
            var isDeleted = deleteCheckbox.length && deleteCheckbox.is(':checked');
            
            if (!isDeleted && productSelect.length && productSelect.val()) {
                var qty = parseFloat(qtyField.val()) || 0;
                var price = parseFloat(priceField.val()) || 0;
                items.push({ index: i, product: productSelect.val(), qty: qty, price: price, total: qty * price });
            }
        }
        return items;
    }
    
    function calculateTotals() {
        var items = getAllPurchaseItems();
        var subtotal = items.reduce((sum, item) => sum + item.total, 0);
        var paid = parseFloat($('#id_paid').val()) || 0;
        var outstanding = subtotal - paid;
        var paymentPercentage = subtotal > 0 ? (paid / subtotal) * 100 : 0;
        paymentPercentage = Math.min(100, Math.max(0, paymentPercentage));
        
        return { subtotal, paid, outstanding, paymentPercentage, itemCount: items.length };
    }
    
    function updateTotalDisplay() {
        var totals = calculateTotals();
        
        $('#purchase-subtotal-display').text('Rs. ' + totals.subtotal.toLocaleString(undefined, {minimumFractionDigits: 2}));
        $('#purchase-paid-display').text('Rs. ' + totals.paid.toLocaleString(undefined, {minimumFractionDigits: 2}));
        $('#purchase-outstanding-display').text('Rs. ' + totals.outstanding.toLocaleString(undefined, {minimumFractionDigits: 2}));
        $('#payment-percentage').text(totals.paymentPercentage.toFixed(1) + '%');
        $('#payment-progress-bar').css('width', totals.paymentPercentage + '%');
        $('#payment-progress-bar').css('background', totals.paymentPercentage >= 100 ? '#28a745' : (totals.paymentPercentage >= 50 ? '#ffc107' : '#f44336'));
        $('#purchase-outstanding-display').css('color', totals.outstanding > 0 ? '#ffcccc' : '#ccffcc');
        $('#item-count-display').text(totals.itemCount + ' item' + (totals.itemCount !== 1 ? 's' : ''));
    }
    
    // ============================================
    // EVENT LISTENERS
    // ============================================
    function attachAllEvents() {
        $(document).on('input change', '.dynamic-purchaseitem_set input[name$="-qty"], .dynamic-purchaseitem_set input[name$="-price"]', function() {
            var match = $(this).attr('name').match(/purchaseitem_set-(\d+)-/);
            if (match) {
                updateRowTotal(match[1]);
                updateTotalDisplay();
            }
        });
        
        $(document).on('change', '.dynamic-purchaseitem_set select[name$="-product"]', function() {
            var match = $(this).attr('name').match(/purchaseitem_set-(\d+)-/);
            if (match) {
                setTimeout(function() {
                    updateRowTotal(match[1]);
                    updateTotalDisplay();
                }, 100);
            }
        });
        
        $(document).on('input change', '#id_paid', function() {
            updateTotalDisplay();
        });
        
        $(document).on('click', '.inline-deletelink', function() {
            setTimeout(updateTotalDisplay, 200);
        });
        
        $(document).on('click', '.add-row a', function() {
            setTimeout(function() {
                addTotalColumnToTable();
                attachAllEvents();
                updateAllRowTotals();
                updateTotalDisplay();
            }, 300);
        });
    }
    
    $('#refresh-total-btn').click(function() {
        updateAllRowTotals();
        updateTotalDisplay();
    });
    
    // Initialize
    setTimeout(function() {
        addTotalColumnToTable();
        attachAllEvents();
        updateAllRowTotals();
        updateTotalDisplay();
    }, 500);
});
</script>

<style>
    .row-total-display {
        font-weight: bold;
        text-align: right;
        padding: 8px !important;
        transition: color 0.3s;
    }
    .total-column-header {
        text-align: right;
        padding: 8px !important;
        background: #f8f9fa;
    }
    #refresh-total-btn:hover {
        background: rgba(255,255,255,0.5) !important;
        transform: scale(1.02);
        transition: all 0.2s;
    }
</style>

{% endblock %}
