name: Django Server Runner & Cloudflare Tunnel

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Manual trigger ke liye

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "django-import-export>=3.3.0" django pymysql mysqlclient django-dbbackup django-axes reportlab openpyxl pillow
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Cloudflared
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb

    - name: Reset Database & Create Fresh Superuser
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_PASSWORD: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
      run: |
        # 1. Database ka tamam existing data flush karein
        python manage.py flush --no-input

        # 2. Fresh migrations apply karein
        python manage.py migrate

        # 3. Fresh superuser create karein (clean one-liner formulation)
        python manage.py shell -c "from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').delete(); User.objects.create_superuser('admin', 'admin@example.com', 'AdminPassword123')"

        echo "=========================================="
        echo "Fresh Superuser created successfully!"
        echo "Username: admin"
        echo "Password: AdminPassword123"
        echo "=========================================="

    - name: Launch Permanent Cloudflare Tunnel
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_PASSWORD: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
        TUNNEL_CREDS: ${{ secrets.CLOUDFLARE_CREDENTIALS }}
        TUNNEL_UUID: "1a0537c0-5705-4b1d-9887-bd4e31e4450b"
      run: |
        # Background mein Django server start karein
        python manage.py runserver 0.0.0.0:8000 &

        # Cloudflare Tunnel directory setup
        mkdir -p ~/.cloudflared
        echo "$TUNNEL_CREDS" > ~/.cloudflared/$TUNNEL_UUID.json

        # Config File Create Karein
        cat <<EOF > ~/.cloudflared/config.yml
        tunnel: $TUNNEL_UUID
        credentials-file: /home/runner/.cloudflared/$TUNNEL_UUID.json
        ingress:
          - hostname: hadi88.online
            service: http://localhost:8000
          - service: http_status:404
        EOF

        # Permanent Named Tunnel Start Karein
        nohup cloudflared tunnel run --config ~/.cloudflared/config.yml $TUNNEL_UUID > cloudflare.log 2>&1 &
        sleep 5

        STATIC_URL="https://hadi88.online"

        # Send Alert to ntfy
        curl -s -X POST https://ntfy.sh/lev_nasiiar_link_988 \
          -H "Title: 🚀 Live Django Application Active" \
          -H "Click: $STATIC_URL" \
          -H "Priority: high" \
          -H "Tags: rocket,link" \
          -d "Your static application is live at: $STATIC_URL"

        echo "=========================================================="
        echo "🚀 ACCESS YOUR DJANGO APP HERE:"
        echo "👉 $STATIC_URL"
        echo "=========================================================="
        echo "🔑 DEFAULT LOGIN CREDENTIALS:"
        echo "👤 Username: admin"
        echo "🔑 Password: AdminPassword123"
        echo "=========================================================="

        # Server ko 3 ghante (10800 seconds) tak active rakhne ke liye sleep
        sleep 10800
