name: Django Server Runner & Cloudflare Tunnel

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Manual trigger ke liye

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install django pymysql mysqlclient django-dbbackup django-import-export django-axes reportlab openpyxl pillow
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Cloudflared
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb

    - name: Run Database Migrations
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_PASSWORD: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
      run: |
        python manage.py migrate

    - name: Start Django & Cloudflare Tunnel (3 Hours)
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_PASSWORD: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
      run: |
        # Background mein Django server start karein
        python manage.py runserver 0.0.0.0:8000 &
        
        # Cloudflare Tunnel start karein aur output log mein save karein
        cloudflared tunnel --url http://localhost:8000 > cloudflared.log 2>&1 &
        
        echo "=========================================="
        echo "Waiting for Cloudflare link generation..."
        echo "=========================================="
        
        # Link generate hone ka wait karein
        sleep 8
        
        # Log se trycloudflare link find karke highlight karke print karein
        TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9 presentation]*\.trycloudflare\.com' cloudflared.log | head -n 1)
        
        echo ""
        echo "=========================================================="
        echo "🚀 ACCESS YOUR DJANGO APP HERE:"
        echo "👉 $TUNNEL_URL"
        echo "=========================================================="
        echo ""
        
        # Server ko 3 ghante (10800 seconds) tak active rakhne ke liye sleep
        sleep 10800
