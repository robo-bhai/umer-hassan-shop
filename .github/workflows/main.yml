name: Django Server Runner & Cloudflare Tunnel

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Manual trigger ke liye

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymysql gunicorn "django-import-export>=3.3.0" django django-dbbackup django-axes reportlab openpyxl pillow python-barcode qrcode
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Cloudflared
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb

    - name: Run Django Migrations & Setup
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
        DJANGO_SUPERUSER_NAME: ${{ secrets.DJANGO_SUPERUSER_NAME }}
        DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
        DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
      run: |
        echo "=========================================="
        echo "STEP 1: Making & Applying Fresh Migrations"
        echo "=========================================="
        
        python manage.py makemigrations --no-input
        python manage.py migrate --no-input
        
        echo "=========================================="
        echo "STEP 2: Creating Superuser"
        echo "=========================================="
        
        python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'P1.settings'); django.setup(); from django.contrib.auth import get_user_model; User = get_user_model(); username = os.environ.get('DJANGO_SUPERUSER_NAME', 'admin'); email = os.environ.get('DJANGO_SUPERUSER_EMAIL', 'admin@example.com'); password = os.environ.get('DJANGO_SUPERUSER_PASSWORD'); 
        if password and not User.objects.filter(username=username).exists():
            User.objects.create_superuser(username, email, password)
            print('✓ Superuser created successfully')
        else:
            print('✓ Superuser already exists or password not provided')"
        
        echo "=========================================="
        echo "✅ DATABASE MIGRATION & SETUP COMPLETED!"
        echo "=========================================="

    - name: Start Django Server
      env:
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
      run: |
        echo "=========================================="
        echo "STEP 3: Starting Django Server with Gunicorn"
        echo "=========================================="
        
        # Start with Gunicorn background daemon
        nohup gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 P1.wsgi:application > gunicorn.log 2>&1 &
        
        echo "Waiting for server to initialize..."
        sleep 10
        
        # Check if server is running smoothly
        if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 | grep -q "200\|302\|301\|404"; then
            echo "✅ Django server is running successfully on port 8000"
        else
            echo "⚠️ Server warning, checking diagnostics logs..."
            tail -30 gunicorn.log
        fi
        
        echo "=========================================="

    - name: Launch Cloudflare Tunnel
      env:
        TUNNEL_CREDS: ${{ secrets.CLOUDFLARE_CREDENTIALS }}
        TUNNEL_UUID: "1a0537c0-5705-4b1d-9887-bd4e31e4450b"
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
      run: |
        echo "=========================================="
        echo "STEP 4: Launching Cloudflare Tunnel"
        echo "=========================================="
        
        # Setup Cloudflare credentials configuration
        mkdir -p ~/.cloudflared
        echo "$TUNNEL_CREDS" > ~/.cloudflared/$TUNNEL_UUID.json
        
        cat <<EOF > ~/.cloudflared/config.yml
        tunnel: $TUNNEL_UUID
        credentials-file: /home/runner/.cloudflared/$TUNNEL_UUID.json
        ingress:
          - hostname: hadi88.online
            service: http://localhost:8000
          - service: http_status:404
        EOF
        
        echo "=========================================================="
        echo "🚀 APPLICATION IS LIVE AND SECURED AT:"
        echo "👉 https://hadi88.online"
        echo "=========================================================="
        echo "✅ Database tables and ContentTypes fully synchronized"
        echo "✅ Gunicorn application instance active"
        echo "✅ Cloudflare secure tunnel mapped"
        echo "=========================================================="
        
        # Print logs for instant confirmation
        echo "Gunicorn Runtime Logs:"
        tail -30 gunicorn.log || true
        
        echo "=========================================================="
        echo "Initializing Cloudflare Tunnel connection..."
        echo "=========================================================="
        
        # Run Cloudflare Tunnel in foreground to keep workflow active
        cloudflared tunnel --config ~/.cloudflared/config.yml run $TUNNEL_UUID
