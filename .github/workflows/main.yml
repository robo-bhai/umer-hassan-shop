name: Django Server Runner & Cloudflare Tunnel

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymysql "django-import-export>=3.3.0" django django-dbbackup django-axes reportlab openpyxl pillow python-barcode qrcode
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Cloudflared
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb

    - name: Database Migration - Fix Duplicate Column
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_PASSWORD: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
        DJANGO_SUPERUSER_NAME: ${{ secrets.DJANGO_SUPERUSER_NAME }}
        DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
        DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
      run: |
        echo "=========================================="
        echo "Step 1: Database Migration Started"
        echo "=========================================="
        
        # Check migration status
        python manage.py showmigrations --plan || true
        
        # Remove problematic migration files
        echo "Removing problematic migration files..."
        rm -f app/migrations/0015_*.py
        rm -f app/migrations/0016_*.py
        rm -f app/migrations/0017_*.py
        rm -f app/migrations/__pycache__/* || true
        
        # Create fresh migrations
        echo "Creating fresh migrations..."
        python manage.py makemigrations --no-input || true
        
        # Fake apply all migrations
        echo "Fake applying all migrations..."
        python manage.py migrate --fake --no-input || true
        
        # Apply new migrations
        echo "Applying new migrations..."
        python manage.py migrate --no-input || true
        
        # Verify and add missing columns if needed
        python -c "
        import os, pymysql
        pymysql.install_as_MySQLdb()
        import django
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'P1.settings')
        django.setup()
        from django.db import connection
        
        with connection.cursor() as cursor:
            # Check vendor_so_number column
            cursor.execute('''
                SELECT COUNT(*) FROM information_schema.COLUMNS 
                WHERE TABLE_SCHEMA = DATABASE() 
                AND TABLE_NAME = 'app_purchaseorder' 
                AND COLUMN_NAME = 'vendor_so_number'
            ''')
            exists = cursor.fetchone()[0]
            
            if not exists:
                cursor.execute('''
                    ALTER TABLE app_purchaseorder 
                    ADD COLUMN vendor_so_number VARCHAR(255) NULL
                ''')
                print('✓ vendor_so_number column added')
            else:
                print('✓ vendor_so_number column already exists')
        "

        # Superuser create
        python -c "
        import os
        import django
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'P1.settings')
        django.setup()
        from django.contrib.auth import get_user_model
        User = get_user_model()
        username = os.environ.get('DJANGO_SUPERUSER_NAME', 'admin')
        email = os.environ.get('DJANGO_SUPERUSER_EMAIL', 'admin@example.com')
        password = os.environ.get('DJANGO_SUPERUSER_PASSWORD')
        if not User.objects.filter(username=username).exists():
            User.objects.create_superuser(username, email, password)
            print('✓ Superuser created successfully.')
        else:
            print('✓ Superuser already exists.')
        "
        
        echo "=========================================="
        echo "Step 1: Database Migration Completed ✅"
        echo "=========================================="

    - name: Start Django Server
      run: |
        echo "=========================================="
        echo "Step 2: Starting Django Server"
        echo "=========================================="
        python manage.py runserver 0.0.0.0:8000 &
        sleep 5
        echo "✓ Django server started on port 8000"
        echo "=========================================="

    - name: Launch Cloudflare Tunnel
      env:
        TUNNEL_CREDS: ${{ secrets.CLOUDFLARE_CREDENTIALS }}
        TUNNEL_UUID: "1a0537c0-5705-4b1d-9887-bd4e31e4450b"
      run: |
        echo "=========================================="
        echo "Step 3: Launching Cloudflare Tunnel"
        echo "=========================================="
        
        mkdir -p ~/.cloudflared
        echo "$TUNNEL_CREDS" > ~/.cloudflared/$TUNNEL_UUID.json
        
        cat <<EOF > ~/.cloudflared/config.yml
        tunnel: $TUNNEL_UUID
        credentials-file: /home/runner/.cloudflared/$TUNNEL_UUID.json
        ingress:
          - hostname: hadi88.online
            service: http://localhost:8000
          - service: http_status:404
        EOF
        
        echo "=========================================================="
        echo "🚀 APPLICATION IS LIVE AT:"
        echo "👉 https://hadi88.online"
        echo "=========================================================="
        echo "✅ Database migration completed"
        echo "✅ Django server running on port 8000"
        echo "✅ Cloudflare tunnel established"
        echo "=========================================================="
        
        cloudflared tunnel --config ~/.cloudflared/config.yml run $TUNNEL_UUID