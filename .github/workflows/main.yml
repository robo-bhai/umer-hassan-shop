name: Django Server Runner & Cloudflare Tunnel

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Manual trigger ke liye

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymysql "django-import-export>=3.3.0" django django-dbbackup django-axes reportlab openpyxl pillow python-barcode qrcode
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Cloudflared
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb

    - name: Professional Database Migration & Health Check
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_PASSWORD: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
        DJANGO_SUPERUSER_NAME: ${{ secrets.DJANGO_SUPERUSER_NAME }}
        DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
        DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
      run: |
        # 1. Professional approach: Database drop nahi karna, sirf safe migrations run karni hain
        echo "Checking database connection and running pending migrations safely..."
        
        python manage.py makemigrations --merge --no-input || true
        
        # Safe migration run (agar koi table missing hogi jaise django_session, toh woh khud create ho jayegi)
        python manage.py migrate --no-input
        python manage.py migrate axes --no-input || true

        # 2. Schema Compatibility Check (e.g., auth_user last_login NULL constraint fix if needed)
        python -c "
        import os, pymysql
        pymysql.install_as_MySQLdb()
        import django
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'P1.settings')
        django.setup()
        from django.db import connection
        with connection.cursor() as cursor:
            try:
                cursor.execute('ALTER TABLE auth_user MODIFY COLUMN last_login DATETIME(6) NULL DEFAULT NULL;')
                print('Checked & verified auth_user schema compatibility.')
            except Exception as e:
                print('Schema check note:', e)
        "

        # 3. Ensure Superuser exists (Agar pehle se hai toh update/ignore karega, data safe rahega)
        python -c "
        import os
        import pymysql
        pymysql.install_as_MySQLdb()
        import django
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'P1.settings')
        django.setup()
        from django.contrib.auth import get_user_model
        User = get_user_model()
        username = os.environ.get('DJANGO_SUPERUSER_NAME', 'admin')
        email = os.environ.get('DJANGO_SUPERUSER_EMAIL', 'admin@example.com')
        password = os.environ.get('DJANGO_SUPERUSER_PASSWORD')
        if not User.objects.filter(username=username).exists():
            User.objects.create_superuser(username, email, password)
            print('Superuser created successfully.')
        else:
            print('Superuser already exists. Skipping recreation to preserve data.')
        "

        echo "=========================================="
        echo "Database health check & migrations completed safely!"
        echo "=========================================="

    - name: Launch Permanent Cloudflare Tunnel
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_PASSWORD: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
        DJANGO_SUPERUSER_NAME: ${{ secrets.DJANGO_SUPERUSER_NAME }}
        DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
        DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
        TUNNEL_CREDS: ${{ secrets.CLOUDFLARE_CREDENTIALS }}
        TUNNEL_UUID: "1a0537c0-5705-4b1d-9887-bd4e31e4450b"
      run: |
        # Background mein Django server start karein
        python manage.py runserver 0.0.0.0:8000 &
        sleep 3

        # Cloudflare Tunnel directory setup
        mkdir -p ~/.cloudflared
        echo "$TUNNEL_CREDS" > ~/.cloudflared/$TUNNEL_UUID.json

        # Config File Create Karein
        cat <<EOF > ~/.cloudflared/config.yml
        tunnel: $TUNNEL_UUID
        credentials-file: /home/runner/.cloudflared/$TUNNEL_UUID.json
        ingress:
          - hostname: hadi88.online
            service: http://localhost:8000
          - service: http_status:404
        EOF

        STATIC_URL="https://hadi88.online"

        # Send Alert to ntfy
        curl -s -X POST https://ntfy.sh/lev_nasiiar_link_988 \
          -H "Title: 🚀 Live Django Application Active" \
          -H "Click: $STATIC_URL" \
          -H "Priority: high" \
          -H "Tags: rocket,link" \
          -d "Your static application is live at: $STATIC_URL"

        echo "=========================================================="
        echo "🚀 ACCESS YOUR DJANGO APP HERE:"
        echo "👉 $STATIC_URL"
        echo "=========================================================="
        echo "🔑 Database integrity maintained without data drops."
        echo "=========================================================="

        # Permanent Tunnel ko FOREGROUND mein run karein taake action active rahe
        cloudflared tunnel --config ~/.cloudflared/config.yml run $TUNNEL_UUID
